<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3D Hand Frame Capture</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      overflow: hidden;
      height: 100vh;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video, #cleanBgCanvas {
      display: none;
    }
    canvas.layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <!-- Three.js & Cannon-es (3D描画 & 3D物理演算) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <div id="container">
    <video id="video" playsinline></video>
    <!-- 手が写っていない時の背景記憶用キャンバス -->
    <canvas id="cleanBgCanvas"></canvas>
    <!-- カメラ映像・ガイド描画用2Dキャンバス -->
    <canvas id="bgCanvas" class="layer"></canvas>
    <!-- 3D物理ブロック描画用キャンバス -->
    <canvas id="threeCanvas" class="layer"></canvas>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';

    const video = document.getElementById('video');
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const cleanBgCanvas = document.getElementById('cleanBgCanvas');
    const cleanBgCtx = cleanBgCanvas.getContext('2d');
    const threeCanvas = document.getElementById('threeCanvas');

    let width = window.innerWidth;
    let height = window.innerHeight;
    bgCanvas.width = cleanBgCanvas.width = width;
    bgCanvas.height = cleanBgCanvas.height = height;

    // -----------------------------------------
    // 1. Three.js (3Dシーン・カメラ・ライト)
    // -----------------------------------------
    const scene = new THREE.Scene();
    const fov = 45;
    const cameraZ = 15;
    const camera3D = new THREE.PerspectiveCamera(fov, width / height, 0.1, 100);
    camera3D.position.set(0, 0, cameraZ);
    camera3D.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 10, 12);
    scene.add(dirLight);

    function getWorldViewSize() {
      const vFov = (fov * Math.PI) / 180;
      const worldHeight = 2 * Math.tan(vFov / 2) * cameraZ;
      const worldWidth = worldHeight * (width / height);
      return { worldWidth, worldHeight };
    }

    let { worldWidth, worldHeight } = getWorldViewSize();

    function screenToWorld(sx, sy) {
      const nx = (sx / width) * 2 - 1;
      const ny = -(sy / height) * 2 + 1;
      return new THREE.Vector3(nx * (worldWidth / 2), ny * (worldHeight / 2), 0);
    }

    function worldToScreen(vec3) {
      const v = vec3.clone().project(camera3D);
      return {
        x: (v.x + 1) * 0.5 * width,
        y: (-v.y + 1) * 0.5 * height
      };
    }

    // -----------------------------------------
    // 2. Cannon-es (現実準拠の3D物理演算)
    // -----------------------------------------
    const world = new CANNON.World();
    world.gravity.set(0, -14.0, 0);
    world.broadphase = new CANNON.NaiveBroadphase();
    world.solver.iterations = 10;

    const physicsMat = new CANNON.Material('glass');
    const contactMat = new CANNON.ContactMaterial(physicsMat, physicsMat, {
      friction: 0.5,
      restitution: 0.25
    });
    world.addContactMaterial(contactMat);

    const groundBody = new CANNON.Body({ mass: 0, material: physicsMat });
    groundBody.addShape(new CANNON.Plane());
    groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    groundBody.position.set(0, -worldHeight / 2, 0);
    world.addBody(groundBody);

    const leftWallBody = new CANNON.Body({ mass: 0, material: physicsMat });
    leftWallBody.addShape(new CANNON.Plane());
    leftWallBody.quaternion.setFromEuler(0, Math.PI / 2, 0);
    leftWallBody.position.set(-worldWidth / 2, 0, 0);
    world.addBody(leftWallBody);

    const rightWallBody = new CANNON.Body({ mass: 0, material: physicsMat });
    rightWallBody.addShape(new CANNON.Plane());
    rightWallBody.quaternion.setFromEuler(0, -Math.PI / 2, 0);
    rightWallBody.position.set(worldWidth / 2, 0, 0);
    world.addBody(rightWallBody);

    // -----------------------------------------
    // 3. 3D写真ブロック生成関数
    // -----------------------------------------
    const blocks = [];

    function create3DPhotoBlock(rect) {
      // 指がわずかにかかる外周だけ最小限トリミングし、大きなサイズのまま切り抜く
      const padX = Math.min(rect.w * 0.04, 12);
      const padY = Math.min(rect.h * 0.04, 12);
      const cropX = rect.x + padX;
      const cropY = rect.y + padY;
      const cropW = Math.max(40, rect.w - padX * 2);
      const cropH = Math.max(40, rect.h - padY * 2);

      const texCanvas = document.createElement('canvas');
      texCanvas.width = 512;
      texCanvas.height = 512;
      const tCtx = texCanvas.getContext('2d');

      // 現在のカメラ映像を描画
      tCtx.drawImage(bgCanvas, cropX, cropY, cropW, cropH, 0, 0, 512, 512);
      
      // 枠のフチにかかった指だけをクリーン背景で消す（内側の被写体は消さないように小さめの半径にする）
      if (detectedHands.length > 0 && hasCleanBg) {
        tCtx.save();
        detectedHands.forEach(landmarks => {
          landmarks.forEach(pt => {
            const p = toCanvasCoord(pt);
            const tx = ((p.x - cropX) / cropW) * 512;
            const ty = ((p.y - cropY) / cropH) * 512;
            const radius = (38 / cropW) * 512;

            tCtx.beginPath();
            tCtx.arc(tx, ty, radius, 0, Math.PI * 2);
            tCtx.clip();
            tCtx.drawImage(cleanBgCanvas, cropX, cropY, cropW, cropH, 0, 0, 512, 512);
            tCtx.restore();
            tCtx.save();
          });
        });
        tCtx.restore();
      }

      const texture = new THREE.CanvasTexture(texCanvas);
      texture.colorSpace = THREE.SRGBColorSpace;

      // 3Dサイズ計算（画面上の見た目の大きさをそのまま反映）
      const w3D = (rect.w / width) * worldWidth;
      const h3D = (rect.h / height) * worldHeight;
      const d3D = Math.min(w3D, h3D) * 0.45;

      const photoMat = new THREE.MeshPhysicalMaterial({
        map: texture,
        transparent: true,
        opacity: 0.88,
        roughness: 0.15,
        metalness: 0.05,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
      });

      const sideMat = new THREE.MeshPhysicalMaterial({
        color: 0xdff5ff,
        transparent: true,
        opacity: 0.45,
        roughness: 0.1,
        metalness: 0.1,
        clearcoat: 1.0
      });

      const materials = [sideMat, sideMat, sideMat, sideMat, photoMat, photoMat];
      const geometry = new THREE.BoxGeometry(w3D, h3D, d3D);
      const mesh = new THREE.Mesh(geometry, materials);

      const edges = new THREE.EdgesGeometry(geometry);
      const line = new THREE.LineSegments(
        edges,
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 })
      );
      mesh.add(line);

      const centerPos = screenToWorld(rect.x + rect.w / 2, rect.y + rect.h / 2);
      mesh.position.copy(centerPos);
      scene.add(mesh);

      const shape = new CANNON.Box(new CANNON.Vec3(w3D / 2, h3D / 2, d3D / 2));
      const body = new CANNON.Body({
        mass: 2.0,
        material: physicsMat,
        linearDamping: 0.05,
        angularDamping: 0.15
      });
      body.addShape(shape);
      body.position.set(centerPos.x, centerPos.y, 0);
      body.angularVelocity.set((Math.random() - 0.5) * 1.2, (Math.random() - 0.5) * 1.2, (Math.random() - 0.5) * 0.8);
      world.addBody(body);

      blocks.push({ mesh, body, w3D, h3D, d3D });
    }

    // -----------------------------------------
    // 4. MediaPipe Hands & ジェスチャー判定（大きくても反応するよう緩和）
    // -----------------------------------------
    let detectedHands = [];
    let hasCleanBg = false;
    let frameHoldCount = 0;
    const HOLD_THRESHOLD = 18; // 少し早くシャッターが切れるように調整
    let cooldown = 0;
    let flashAlpha = 0;
    const grabbedMap = new Map();

    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function toCanvasCoord(landmark) {
      return {
        x: (1 - landmark.x) * width,
        y: landmark.y * height
      };
    }

    function isFingerExtended(landmarks, tipIdx, pipIdx) {
      const wrist = landmarks[0];
      return dist(landmarks[tipIdx], wrist) > dist(landmarks[pipIdx], wrist) * 1.05;
    }

    // 大きくフレームを作ったときでも反応するゆったりした判定
    function checkIllustrationFramePose(h1, h2) {
      // 親指と人差し指が伸びていて、小指・薬指が曲がっていればOK（中指は多少浮いていても許容）
      const checkL = (lm) => {
        return isFingerExtended(lm, 4, 2) &&
               isFingerExtended(lm, 8, 6) &&
               !isFingerExtended(lm, 16, 14) &&
               !isFingerExtended(lm, 20, 18);
      };
      if (!checkL(h1) || !checkL(h2)) return null;

      // 画面上のX座標で左手・右手を判別
      const c1 = toCanvasCoord(h1[0]);
      const c2 = toCanvasCoord(h2[0]);
      const leftHand = c1.x < c2.x ? h1 : h2;
      const rightHand = c1.x < c2.x ? h2 : h1;

      const lIndexTip = toCanvasCoord(leftHand[8]);
      const lIndexMcp = toCanvasCoord(leftHand[5]);
      const lThumbTip = toCanvasCoord(leftHand[4]);

      const rIndexTip = toCanvasCoord(rightHand[8]);
      const rIndexMcp = toCanvasCoord(rightHand[5]);
      const rThumbTip = toCanvasCoord(rightHand[4]);

      // 左手（画面左）：人差し指が上向き、親指が右向き
      const leftPoseOk = (lIndexTip.y < lIndexMcp.y) && (lThumbTip.x > lIndexMcp.x);
      // 右手（画面右）：人差し指が左向き、親指が下向き
      const rightPoseOk = (rIndexTip.x < rIndexMcp.x) && (rThumbTip.y > rIndexMcp.y);

      if (!leftPoseOk || !rightPoseOk) return null;

      // 【大幅緩和】指先同士が離れていても、大きな四角形を形作っていればOKにする
      // 許容距離を画面サイズの45%まで拡大
      const looseTouchThreshold = Math.min(width, height) * 0.45;
      const topLeftDist = dist(lIndexTip, rIndexTip);
      const bottomRightDist = dist(lThumbTip, rThumbTip);

      // 左右の手の位置関係が逆転していないかチェック（左手が左、右手が右）
      if (topLeftDist < looseTouchThreshold && bottomRightDist < looseTouchThreshold && lIndexTip.x < rThumbTip.x) {
        // 4本の指の先端・付け根から大きなフレーム矩形を算出
        const minX = Math.min(lIndexTip.x, lIndexMcp.x);
        const maxX = Math.max(rThumbTip.x, rIndexMcp.x);
        const minY = Math.min(rIndexTip.y, rIndexMcp.y, lIndexTip.y);
        const maxY = Math.max(lThumbTip.y, lIndexMcp.y, rThumbTip.y);

        const w = maxX - minX;
        const h = maxY - minY;

        if (w > 60 && h > 60) {
          return { x: minX, y: minY, w, h };
        }
      }
      return null;
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });
    hands.onResults((results) => {
      detectedHands = results.multiHandLandmarks || [];
    });

    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 1280,
      height: 720
    });
    camera.start();

    // -----------------------------------------
    // 5. メインアニメーション＆物理ループ
    // -----------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      world.step(1 / 60, dt, 4);

      // 1. カメラ映像の描画
      bgCtx.save();
      bgCtx.scale(-1, 1);
      bgCtx.translate(-width, 0);

      const vRatio = (video.videoWidth / video.videoHeight) || (16 / 9);
      const cRatio = width / height;
      let drawW = width, drawH = height, drawX = 0, drawY = 0;
      if (cRatio > vRatio) {
        drawH = width / vRatio;
        drawY = (height - drawH) / 2;
      } else {
        drawW = height * vRatio;
        drawX = (width - drawW) / 2;
      }
      if (video.readyState >= 2) {
        bgCtx.drawImage(video, drawX, drawY, drawW, drawH);

        if (detectedHands.length === 0) {
          cleanBgCtx.drawImage(bgCanvas, 0, 0);
          hasCleanBg = true;
        }
      }
      bgCtx.restore();

      // 2. 両手フレームポーズ判定と撮影
      let frameRect = null;
      if (detectedHands.length === 2 && cooldown <= 0) {
        frameRect = checkIllustrationFramePose(detectedHands[0], detectedHands[1]);
      }
      if (cooldown > 0) cooldown--;

      if (frameRect) {
        frameHoldCount++;
        const progress = Math.min(frameHoldCount / HOLD_THRESHOLD, 1);

        // 赤いフレームのプレビュー表示
        bgCtx.save();
        bgCtx.strokeStyle = `rgba(255, 60, 60, ${0.5 + progress * 0.5})`;
        bgCtx.lineWidth = 3 + progress * 4;
        bgCtx.strokeRect(frameRect.x, frameRect.y, frameRect.w, frameRect.h);
        bgCtx.fillStyle = `rgba(255, 60, 60, ${progress * 0.22})`;
        bgCtx.fillRect(frameRect.x, frameRect.y, frameRect.w, frameRect.h);
        bgCtx.restore();

        if (frameHoldCount >= HOLD_THRESHOLD) {
          create3DPhotoBlock(frameRect);
          frameHoldCount = 0;
          cooldown = 35;
          flashAlpha = 0.75;
        }
      } else {
        frameHoldCount = Math.max(0, frameHoldCount - 2);
      }

      // 3. 人差し指と親指での3Dブロック掴み処理
      const activeHandIndices = new Set();

      detectedHands.forEach((landmarks, idx) => {
        const thumbTip = toCanvasCoord(landmarks[4]);
        const indexTip = toCanvasCoord(landmarks[8]);
        const pinchDist = dist(thumbTip, indexTip);
        const pinchCenter = {
          x: (thumbTip.x + indexTip.x) / 2,
          y: (thumbTip.y + indexTip.y) / 2
        };

        bgCtx.save();
        bgCtx.fillStyle = 'rgba(0, 255, 210, 0.8)';
        bgCtx.beginPath();
        bgCtx.arc(thumbTip.x, thumbTip.y, 5, 0, Math.PI * 2);
        bgCtx.arc(indexTip.x, indexTip.y, 5, 0, Math.PI * 2);
        bgCtx.fill();
        bgCtx.restore();

        const pinchThreshold = Math.min(width, height) * 0.065;
        const isPinching = pinchDist < pinchThreshold;

        if (isPinching) {
          activeHandIndices.add(idx);

          if (!grabbedMap.has(idx)) {
            for (let i = blocks.length - 1; i >= 0; i--) {
              const b = blocks[i];
              const alreadyGrabbed = Array.from(grabbedMap.values()).some(g => g.block === b);
              if (alreadyGrabbed) continue;

              const screenPos = worldToScreen(b.mesh.position);
              const hitRadius = (Math.max(b.w3D, b.h3D) / worldWidth) * width * 0.65;

              if (dist(screenPos, pinchCenter) < hitRadius) {
                const worldTarget = screenToWorld(pinchCenter.x, pinchCenter.y);
                grabbedMap.set(idx, {
                  block: b,
                  prevWorldPos: worldTarget.clone(),
                  velocity: new CANNON.Vec3(0, 0, 0)
                });
                b.body.type = CANNON.Body.KINEMATIC;
                b.body.velocity.set(0, 0, 0);
                b.body.angularVelocity.set(0, 0, 0);
                break;
              }
            }
          }

          if (grabbedMap.has(idx)) {
            const grabData = grabbedMap.get(idx);
            const b = grabData.block;
            const targetWorld = screenToWorld(pinchCenter.x, pinchCenter.y);

            grabData.velocity.set(
              (targetWorld.x - grabData.prevWorldPos.x) * 35,
              (targetWorld.y - grabData.prevWorldPos.y) * 35,
              0
            );
            grabData.prevWorldPos.copy(targetWorld);

            b.body.position.set(targetWorld.x, targetWorld.y, 0);
          }
        }
      });

      for (const [idx, grabData] of grabbedMap.entries()) {
        if (!activeHandIndices.has(idx)) {
          const b = grabData.block;
          b.body.type = CANNON.Body.DYNAMIC;
          b.body.wakeUp();
          b.body.velocity.copy(grabData.velocity);
          grabbedMap.delete(idx);
        }
      }

      // 4. 物理ボディの位置・回転を3Dメッシュに同期
      blocks.forEach((b) => {
        if (Math.abs(b.body.position.z) > 2.5) {
          b.body.position.z = Math.sign(b.body.position.z) * 2.5;
          b.body.velocity.z *= -0.3;
        }
        b.mesh.position.copy(b.body.position);
        b.mesh.quaternion.copy(b.body.quaternion);
      });

      // 5. フラッシュエフェクト
      if (flashAlpha > 0) {
        bgCtx.save();
        bgCtx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
        bgCtx.fillRect(0, 0, width, height);
        bgCtx.restore();
        flashAlpha -= 0.06;
      }

      renderer.render(scene, camera3D);
    }

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      bgCanvas.width = cleanBgCanvas.width = width;
      bgCanvas.height = cleanBgCanvas.height = height;

      camera3D.aspect = width / height;
      camera3D.updateProjectionMatrix();
      renderer.setSize(width, height);

      const viewSize = getWorldViewSize();
      worldWidth = viewSize.worldWidth;
      worldHeight = viewSize.worldHeight;
      groundBody.position.set(0, -worldHeight / 2, 0);
      leftWallBody.position.set(-worldWidth / 2, 0, 0);
      rightWallBody.position.set(worldWidth / 2, 0, 0);
    });

    animate();
  </script>
</body>
</html>
