<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>写真を撮ろう</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      display: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <!-- Matter.js 物理演算エンジン -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
  <div id="container">
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    // -----------------------------------------
    // Matter.js 物理演算のセットアップ
    // -----------------------------------------
    const { Engine, World, Bodies, Body, Composite } = Matter;
    const engine = Engine.create();
    const world = engine.world;

    // 画面下部の透明な地面と左右の壁
    const wallThickness = 100;
    let ground = Bodies.rectangle(width / 2, height + wallThickness / 2, width * 2, wallThickness, { isStatic: true });
    let leftWall = Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height * 2, { isStatic: true });
    let rightWall = Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height * 2, { isStatic: true });
    World.add(world, [ground, leftWall, rightWall]);

    // ウィンドウリサイズ対応
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      Body.setPosition(ground, { x: width / 2, y: height + wallThickness / 2 });
      Body.setPosition(leftWall, { x: -wallThickness / 2, y: height / 2 });
      Body.setPosition(rightWall, { x: width + wallThickness / 2, y: height / 2 });
    });

    // 生成された写真ブロックのリスト
    const blocks = [];

    // -----------------------------------------
    // ジェスチャー判定・撮影用変数
    // -----------------------------------------
    let detectedHands = [];
    let frameHoldCount = 0;
    const HOLD_THRESHOLD = 25; // 約0.8秒フレームを作ると撮影
    let cooldown = 0;
    let flashAlpha = 0;

    // 各手の掴み状態を管理 (handIndex -> { body, offsetX, offsetY })
    const grabbedMap = new Map();

    // 2点間の距離
    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    // 鏡像反転したキャンバス座標に変換
    function toCanvasCoord(landmark) {
      return {
        x: (1 - landmark.x) * width,
        y: landmark.y * height
      };
    }

    // 指が伸びているか判定 (手首からの距離で簡易判定)
    function isFingerExtended(landmarks, tipIdx, pipIdx) {
      const wrist = landmarks[0];
      return dist(landmarks[tipIdx], wrist) > dist(landmarks[pipIdx], wrist) * 1.1;
    }

    // L字ポーズ（親指と人差し指が伸びていて、他の指が曲がっている）の判定
    function isLShape(landmarks) {
      const thumbExt = isFingerExtended(landmarks, 4, 2);
      const indexExt = isFingerExtended(landmarks, 8, 6);
      const middleFold = !isFingerExtended(landmarks, 12, 10);
      const ringFold = !isFingerExtended(landmarks, 16, 14);
      const pinkyFold = !isFingerExtended(landmarks, 20, 18);
      return thumbExt && indexExt && middleFold && ringFold && pinkyFold;
    }

    // -----------------------------------------
    // MediaPipe Hands セットアップ
    // -----------------------------------------
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults((results) => {
      detectedHands = results.multiHandLandmarks || [];
    });

    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 1280,
      height: 720
    });
    camera.start();

    // -----------------------------------------
    // メインループ
    // -----------------------------------------
    function updateAndDraw() {
      Engine.update(engine, 1000 / 60);

      // 1. カメラ映像を左右反転して描画（coverフィット計算）
      ctx.save();
      ctx.scale(-1, 1);
      ctx.translate(-width, 0);

      const vRatio = video.videoWidth / video.videoHeight || 16 / 9;
      const cRatio = width / height;
      let drawW = width, drawH = height, drawX = 0, drawY = 0;
      if (cRatio > vRatio) {
        drawH = width / vRatio;
        drawY = (height - drawH) / 2;
      } else {
        drawW = height * vRatio;
        drawX = (width - drawW) / 2;
      }
      if (video.readyState >= 2) {
        ctx.drawImage(video, drawX, drawY, drawW, drawH);
      }
      ctx.restore();

      // 2. 両手によるフレーム（四角形）形成の判定
      let frameRect = null;
      if (detectedHands.length === 2 && cooldown <= 0) {
        const h1 = detectedHands[0];
        const h2 = detectedHands[1];

        if (isLShape(h1) && isLShape(h2)) {
          // 左右の手をX座標（画面上）で判定
          const h1Wrist = toCanvasCoord(h1[0]);
          const h2Wrist = toCanvasCoord(h2[0]);
          const leftHand = h1Wrist.x < h2Wrist.x ? h1 : h2;
          const rightHand = h1Wrist.x < h2Wrist.x ? h2 : h1;

          // 左手（画面左側）：人差し指が上、親指が右向き
          // 右手（画面右側）：人差し指が左向き、親指が下向き
          const lIndexTip = toCanvasCoord(leftHand[8]);
          const lIndexMcp = toCanvasCoord(leftHand[5]);
          const lThumbTip = toCanvasCoord(leftHand[4]);

          const rIndexTip = toCanvasCoord(rightHand[8]);
          const rIndexMcp = toCanvasCoord(rightHand[5]);
          const rThumbTip = toCanvasCoord(rightHand[4]);

          // 距離のしきい値（画面幅の10%以内なら指先が接しているとみなす）
          const touchThreshold = Math.min(width, height) * 0.12;

          // 左手の人差し指先と右手の人差し指先が近い（左上角）
          const topLeftDist = dist(lIndexTip, rIndexTip);
          // 左手の親指先と右手の親指先が近い（右下角）
          const bottomRightDist = dist(lThumbTip, rThumbTip);

          if (topLeftDist < touchThreshold && bottomRightDist < touchThreshold) {
            const minX = Math.min(lIndexTip.x, lIndexMcp.x, rIndexTip.x);
            const maxX = Math.max(rThumbTip.x, rIndexMcp.x, lThumbTip.x);
            const minY = Math.min(lIndexTip.y, rIndexTip.y, rIndexMcp.y);
            const maxY = Math.max(lThumbTip.y, rThumbTip.y, lIndexMcp.y);

            const w = maxX - minX;
            const h = maxY - minY;

            if (w > 40 && h > 40) {
              frameRect = { x: minX, y: minY, w, h };
            }
          }
        }
      }

      if (cooldown > 0) cooldown--;

      // フレームが成立している場合の処理と撮影
      if (frameRect) {
        frameHoldCount++;

        // フレーム枠のガイド表示（ゲージのように色が濃くなる）
        const progress = Math.min(frameHoldCount / HOLD_THRESHOLD, 1);
        ctx.save();
        ctx.strokeStyle = `rgba(255, 80, 80, ${0.4 + progress * 0.6})`;
        ctx.lineWidth = 3 + progress * 4;
        ctx.strokeRect(frameRect.x, frameRect.y, frameRect.w, frameRect.h);
        ctx.fillStyle = `rgba(255, 80, 80, ${progress * 0.25})`;
        ctx.fillRect(frameRect.x, frameRect.y, frameRect.w, frameRect.h);
        ctx.restore();

        // しきい値に達したら撮影してブロック化
        if (frameHoldCount >= HOLD_THRESHOLD) {
          captureBlock(frameRect);
          frameHoldCount = 0;
          cooldown = 45; // 連続撮影防止クールダウン
          flashAlpha = 0.8;
        }
      } else {
        frameHoldCount = Math.max(0, frameHoldCount - 2);
      }

      // 3. 人差し指と親指でのブロック掴み処理
      const activeHandIndices = new Set();

      detectedHands.forEach((landmarks, idx) => {
        const thumbTip = toCanvasCoord(landmarks[4]);
        const indexTip = toCanvasCoord(landmarks[8]);
        const pinchDist = dist(thumbTip, indexTip);
        const pinchCenter = {
          x: (thumbTip.x + indexTip.x) / 2,
          y: (thumbTip.y + indexTip.y) / 2
        };

        // 指先のインジケーター描画
        ctx.save();
        ctx.fillStyle = 'rgba(0, 255, 200, 0.7)';
        ctx.beginPath();
        ctx.arc(thumbTip.x, thumbTip.y, 6, 0, Math.PI * 2);
        ctx.arc(indexTip.x, indexTip.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const pinchThreshold = Math.min(width, height) * 0.06;
        const isPinching = pinchDist < pinchThreshold;

        if (isPinching) {
          activeHandIndices.add(idx);

          if (!grabbedMap.has(idx)) {
            // まだ掴んでいない場合、ピンチ位置にあるブロックを探す（手前のもの優先）
            for (let i = blocks.length - 1; i >= 0; i--) {
              const b = blocks[i];
              // すでに他の手で掴まれていないかチェック
              const alreadyGrabbed = Array.from(grabbedMap.values()).some(g => g.block === b);
              if (alreadyGrabbed) continue;

              if (Matter.Bounds.contains(b.body.bounds, pinchCenter)) {
                grabbedMap.set(idx, {
                  block: b,
                  prevX: pinchCenter.x,
                  prevY: pinchCenter.y
                });
                Body.setStatic(b.body, true); // 掴んでいる間は重力を無効化
                break;
              }
            }
          }

          // 掴んでいるブロックを指の位置に追従させる
          if (grabbedMap.has(idx)) {
            const grabData = grabbedMap.get(idx);
            const b = grabData.block;
            const vx = pinchCenter.x - grabData.prevX;
            const vy = pinchCenter.y - grabData.prevY;

            Body.setPosition(b.body, { x: pinchCenter.x, y: pinchCenter.y });
            grabData.prevX = pinchCenter.x;
            grabData.prevY = pinchCenter.y;
            grabData.vx = vx;
            grabData.vy = vy;
          }
        }
      });

      // ピンチを離した手のブロックを解放（物理演算再開）
      for (const [idx, grabData] of grabbedMap.entries()) {
        if (!activeHandIndices.has(idx)) {
          const b = grabData.block;
          Body.setStatic(b.body, false);
          // 離した瞬間の手の動きを初速として与える
          Body.setVelocity(b.body, {
            x: (grabData.vx || 0) * 0.8,
            y: (grabData.vy || 0) * 0.8
          });
          grabbedMap.delete(idx);
        }
      }

      // 4. 透明な写真ブロックの描画
      blocks.forEach((b) => {
        const { x, y } = b.body.position;
        const angle = b.body.angle;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        // 半透明の写真を描画
        ctx.globalAlpha = 0.72;
        ctx.drawImage(b.image, -b.w / 2, -b.h / 2, b.w, b.h);

        // ガラス・透明ブロック風のハイライトと枠線
        ctx.globalAlpha = 1.0;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);

        // 内側の光沢グラデーション
        const grad = ctx.createLinearGradient(-b.w / 2, -b.h / 2, b.w / 2, b.h / 2);
        grad.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
        grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.0)');
        grad.addColorStop(1, 'rgba(255, 255, 255, 0.2)');
        ctx.fillStyle = grad;
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);

        ctx.restore();
      });

      // 5. 撮影時のフラッシュエフェクト
      if (flashAlpha > 0) {
        ctx.save();
        ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
        ctx.fillRect(0, 0, width, height);
        ctx.restore();
        flashAlpha -= 0.06;
      }

      requestAnimationFrame(updateAndDraw);
    }

    // -----------------------------------------
    // 指定領域を切り抜いて物理ブロックを生成
    // -----------------------------------------
    function captureBlock(rect) {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = rect.w;
      offCanvas.height = rect.h;
      const offCtx = offCanvas.getContext('2d');

      // 現在のメインキャンバス（カメラ映像のみ描画済みの状態）から切り抜き
      offCtx.drawImage(
        canvas,
        rect.x, rect.y, rect.w, rect.h,
        0, 0, rect.w, rect.h
      );

      // Matter.js の剛体を作成
      const body = Bodies.rectangle(
        rect.x + rect.w / 2,
        rect.y + rect.h / 2,
        rect.w,
        rect.h,
        {
          restitution: 0.35, // バウンド係数
          friction: 0.6,
          density: 0.002
        }
      );

      World.add(world, body);
      blocks.push({
        body,
        image: offCanvas,
        w: rect.w,
        h: rect.h
      });
    }

    // ループ開始
    updateAndDraw();
  </script>
</body>
</html>
